      PORT: 8080
      NODE_ENV: production
      DATABASE_URL: postgresql://pfm:pfm_secret@postgres:5432/pfm
      ISSUER_PRIVATE_KEY_PATH: /app/keys/works.key
      ISSUER_ID: did:web:works.demo.gov
      STATUS_BASE_URL: http://works-proof-issuer:8080
    volumes:
