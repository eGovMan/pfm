# PFM Stack Demo – all services on internal port 8080; Keycloak 8088; UIs 3000, 3001
# Internal network: pfm-network. Only required ports exposed to host.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pfm
      POSTGRES_PASSWORD: pfm_secret
      POSTGRES_DB: pfm
    volumes:
      - pfm_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pfm -d pfm"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pfm-network

  keycloak:
    image: keycloak/keycloak:23.0
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/pfm
      KC_DB_USERNAME: pfm
      KC_DB_PASSWORD: pfm_secret
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_PORT: 8080
    ports:
      - "8088:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - pfm-network

  directory-service:
    build:
      context: .
      dockerfile: apps/directory-service/Dockerfile
    environment:
      PORT: 8080
      NODE_ENV: production
      DATABASE_URL: postgresql://pfm:pfm_secret@postgres:5432/pfm
      DIRECTORY_SEED_SECRET: ${DIRECTORY_SEED_SECRET:-pfm-demo-seed-secret}
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8080/health', (r)=>{ let b=''; r.on('data',c=>b+=c); r.on('end',()=>process.exit(r.statusCode===200?0:1)); }).on('error',()=>process.exit(1));"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - pfm-network

  rulebook-service:
    build:
      context: .
      dockerfile: apps/rulebook-service/Dockerfile
    environment:
      PORT: 8080
      NODE_ENV: production
      DATABASE_URL: postgresql://pfm:pfm_secret@postgres:5432/pfm
    depends_on:
